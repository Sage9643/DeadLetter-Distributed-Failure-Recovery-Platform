services:
  postgres:
    image: postgres:16-alpine
    container_name: deadletter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: deadletter
      POSTGRES_PASSWORD: deadletter_dev_password
      POSTGRES_DB: deadletter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deadletter -d deadletter"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: deadletter-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: deadletter
      RABBITMQ_DEFAULT_PASS: deadletter_dev_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data: