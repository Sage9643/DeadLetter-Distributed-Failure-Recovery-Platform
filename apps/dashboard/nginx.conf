# Phase 16: nginx config for the production dashboard container.
# Serves the built static SPA and proxies /api + /ws to the api
# service by Docker Compose service name, so the dashboard container
# is the single public entry point in infra/docker-compose.prod.yml.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets: long-lived, content-hashed filenames from Vite's
    # build -- safe to cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any non-file, non-/api, non-/ws route serves
    # index.html so client-side routing (if added later) keeps working.
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://api:3000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
